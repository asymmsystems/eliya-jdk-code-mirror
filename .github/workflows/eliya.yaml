  # lint:
  #   name: eliya-lint
  #   uses: ./.github/workflows/eliya-lint.yaml
  #
  # fips-validate:
  #   name: eliya-fips-validate
  #   uses: ./.github/workflows/eliya-fips-validate.yaml
  #
  # license-check:
  #   name: eliya-license-check
  #   uses: ./.github/workflows/eliya-license-check.yaml
